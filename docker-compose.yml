services:
  mongo:
    build: ./mongo
    container_name: mongo-datasetpolicies
    # Root creds are baked into mongo/Dockerfile — internal only, never
    # partner-configurable, so not sourced from .env.
    # No "ports:" mapping on purpose — the app reaches this over the internal
    # Docker network (mongo:27017); nothing outside the compose network,
    # including the host itself, needs to reach Mongo directly.
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  app:
    build: .
    container_name: encryption-api
    env_file:
      - .env
    environment:
      # Internal wiring to the bundled mongo service (must match mongo/init/01-init.js).
      # Connects as the scoped "app" user (readWrite on datasetPolicies only),
      # not the bootstrap root account — not partner-facing, kept out of .env.
      - MONGO_URI=mongodb://app:app_change_me_internal@mongo:27017/datasetPolicies
      - MONGO_DB=datasetPolicies
      - BACKUP_DIR=/app/backups
    volumes:
      # Bind mount, deliberately NOT a named volume: `docker compose down -v`
      # only destroys named volumes declared below (mongo-data), so this
      # host directory survives that command untouched. That's the whole
      # point — down -v is the recovery step for breaking schema
      # migrations, and the backup snapshots need to outlive it, not get
      # wiped alongside mongo-data.
      - ./backups:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
